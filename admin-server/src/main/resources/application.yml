server:
  port: 9090
  # Cloudflare Tunnel 같은 리버스 프록시가 전달한 원래 HTTPS 스킴을 반영한다.
  forward-headers-strategy: framework
spring:
  application:
    name: admin-server
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
        - '*'
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
    logfile:
      access: read-only
