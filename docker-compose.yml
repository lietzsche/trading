x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *bounded-logs
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Seoul
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nat

  calculation-service:
    logging: *bounded-logs
    image: trading/calculation-service:latest
    build:
      context: ./calculation-service
      target: production
    environment:
      TZ: Asia/Seoul
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nat

  api-service:
    logging: *bounded-logs
    image: trading/api-service:latest
    build:
      context: ./api-service
      target: production
    env_file:
      - .runtime.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bion_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      CALCULATION_SERVICE_URL: http://calculation-service:8000
      SESSION_COOKIE_SECURE: "true"
      TRADING_EXECUTION_ENABLED: "true"
      AUTO_APPLY_COOLDOWN_HOURS: ${AUTO_APPLY_COOLDOWN_HOURS:-72}
      ERROR_LOG_RETENTION_DAYS: ${ERROR_LOG_RETENTION_DAYS:-30}
      ERROR_LOG_MAX_RECORDS: ${ERROR_LOG_MAX_RECORDS:-10000}
      US_STOCK_SYMBOLS: ${US_STOCK_SYMBOLS:-AAPL,MSFT,NVDA,AMZN,GOOGL,META,BRK-B,JPM,V,MA,UNH,JNJ,PG,KO,PEP,ABBV,MRK,XOM,CVX,O,MO,PM,VZ,T,IBM,CSCO,TXN,ADP,MCD,WMT,COST,HD,LOW,CAT,NEE,DUK,SO,SCHD,VYM,DGRO}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - nat
    depends_on:
      postgres:
        condition: service_healthy
      calculation-service:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  db-migrate:
    image: postgres:15
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bion_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:-postgres}
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/V001__active_recommendation_uniqueness.sql", "-f", "/migrations/V002__ai_analysis.sql", "-f", "/migrations/V003__ai_conversations.sql", "-f", "/migrations/V004__ai_portfolio_consent.sql", "-f", "/migrations/V005__ai_automation.sql", "-f", "/migrations/V006__portfolio_dashboard.sql", "-f", "/migrations/V007__ai_analysis_visibility.sql", "-f", "/migrations/V008__ai_settings_revert.sql", "-f", "/migrations/V009__error_retention_index.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nat
    restart: "no"

volumes:
  postgres_data:
    name: 001_postgres_data

networks:
  nat:
    driver: bridge
