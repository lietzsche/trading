services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Seoul
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nat

  calculation-service:
    image: trading/calculation-service:latest
    build:
      context: ./calculation-service
      target: production
    environment:
      TZ: Asia/Seoul
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nat

  api-service:
    image: trading/api-service:latest
    build:
      context: ./api-service
      target: production
    env_file:
      - .runtime.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bion_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      CALCULATION_SERVICE_URL: http://calculation-service:8000
      SESSION_COOKIE_SECURE: "true"
      TRADING_EXECUTION_ENABLED: "true"
      TZ: Asia/Seoul
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - nat
    depends_on:
      postgres:
        condition: service_healthy
      calculation-service:
        condition: service_healthy

  db-migrate:
    image: postgres:15
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bion_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:-postgres}
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/V001__active_recommendation_uniqueness.sql"]
    depends_on:
      api-service:
        condition: service_healthy
    networks:
      - nat
    restart: "no"

volumes:
  postgres_data:
    name: 001_postgres_data

networks:
  nat:
    driver: bridge
