<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E182E" />
      <stop offset="55%" stop-color="#091122" />
      <stop offset="100%" stop-color="#060A14" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="72%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="25%" cy="76%" r="56%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c1Grad" x1="0" y1="276" x2="0" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="c2Grad" x1="0" y1="220" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="c3Grad" x1="0" y1="142" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="maWave" x1="95" y1="362" x2="415" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#emeraldGlow)" />
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#cyanGlow)" />
  <rect x="10" y="10" width="492" height="492" rx="112" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Subtle Quant Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="128" y1="20" x2="128" y2="492" />
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="384" y1="20" x2="384" y2="492" />
    <line x1="20" y1="128" x2="492" y2="128" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="20" y1="384" x2="492" y2="384" />
  </g>

  <!-- Candle 1 (Left - Blue) -->
  <rect x="145" y="250" width="12" height="158" rx="6" fill="#60A5FA" fill-opacity="0.9" />
  <rect x="124" y="286" width="54" height="90" rx="14" fill="url(#c1Grad)" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2" />

  <!-- Candle 2 (Middle - Cyan) -->
  <rect x="241" y="182" width="12" height="194" rx="6" fill="#67E8F9" fill-opacity="0.92" />
  <rect x="220" y="224" width="54" height="114" rx="14" fill="url(#c2Grad)" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2" />

  <!-- Candle 3 (Right - Emerald Breakout) -->
  <rect x="338" y="99" width="12" height="240" rx="6" fill="#6EE7B7" fill-opacity="0.95" />
  <rect x="317" y="145" width="54" height="152" rx="14" fill="url(#c3Grad)" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="2" />

  <!-- MA40 Breakout Curve Backing -->
  <path d="M99 357 C196 352 279 265 378 156" stroke="#070D19" stroke-width="44" stroke-linecap="round" />
  <polygon points="432,104 330,118 370,162 396,204" fill="#070D19" stroke="#070D19" stroke-width="14" stroke-linejoin="round" />

  <!-- MA40 Breakout Curve & Arrowhead -->
  <path d="M99 357 C196 352 279 265 378 156" stroke="url(#maWave)" stroke-width="30" stroke-linecap="round" />
  <polygon points="424,111 336,120 373,161 392,198" fill="#6EE7B7" />

  <!-- Golden Cross Signal Node -->
  <circle cx="288" cy="249" r="24" fill="#FFFFFF" stroke="#10B981" stroke-width="9" />
</svg>
